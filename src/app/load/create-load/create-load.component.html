<div class="load-page">

    <!-- Toast message -->
    <div *ngIf="message" class="toast-message">
      {{ message }}
    </div>

  <div class="load-container">

    <h1>Create Load</h1>

    <p *ngIf="message" class="message">
      {{ message }}
    </p>

    <form
      [formGroup]="loadForm"
      (ngSubmit)="createLoad()">

      <div class="form-row">

        <div class="form-group">
          <label>Customer <span class="required">*</span></label>
          <select class="form-input-field" formControlName="customerId">
            <option value="">Select Customer</option>
            <option
              *ngFor="let customer of customers"
              [value]="customer.id">
              {{ customer.companyName }}
            </option>
          </select>

                  <div
  class="validation-error"
  *ngIf="loadForm.get('customerId')?.touched &&
         loadForm.get('customerId')?.hasError('required')">
  Customer is required
</div>
        </div>

        <div class="form-group">
          <label>Carrier <span class="required">*</span></label>
          <select class="form-input-field" formControlName="carrierId">
            <option value="">Select Carrier</option>
            <option
              *ngFor="let carrier of carriers"
              [value]="carrier.id">
              {{ carrier.carrierName }}
            </option>
          </select>
          <div
  class="validation-error"
  *ngIf="loadForm.get('carrierId')?.touched &&
         loadForm.get('carrierId')?.hasError('required')">
  Carrier is required
</div>
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label>BOL Number</label>
          <input
            type="text" class="form-input-field"
            formControlName="bolNumber"
            placeholder="BOL10006">
        </div>

        <div class="form-group">
          <label>Status</label>
          <select class="form-input-field" formControlName="status">
            <option value="CREATED">Created</option>
            <option value="TENDERED">Tendered</option>
          </select>
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label>Pickup Location <span class="required">*</span></label>
          <input
            type="text" class="form-input-field"
            formControlName="pickupLocation"
            placeholder="Chennai">

            <div
  class="validation-error"
  *ngIf="loadForm.get('pickupLocation')?.touched &&
         loadForm.get('pickupLocation')?.hasError('required')">
  Pickup Location is required
</div>
        </div>

        <div class="form-group">
          <label>Delivery Location <span class="required">*</span></label>
          <input
            type="text" class="form-input-field"
            formControlName="deliveryLocation"
            placeholder="Bangalore">

            <div
  class="validation-error"
  *ngIf="loadForm.get('deliveryLocation')?.touched &&
         loadForm.get('deliveryLocation')?.hasError('required')">
  Delivery Location is required
</div>
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label>Pickup Date <span class="required">*</span></label>
          <input
            type="date" class="form-input-field"
            formControlName="pickupDate">
            <div
  class="validation-error"
  *ngIf="loadForm.get('pickupDate')?.touched &&
         loadForm.get('pickupDate')?.hasError('required')">
  Pickup Date is required
</div>
        </div>

        <div class="form-group">
          <label>Delivery Date <span class="required">*</span></label>
          <input class="form-input-field"
            type="date"
            formControlName="deliveryDate">

            <div
  class="validation-error"
  *ngIf="loadForm.get('deliveryDate')?.touched &&
         loadForm.get('deliveryDate')?.hasError('required')">
  Delivery Date is required
</div>
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label>Weight <span class="required">*</span></label>
          <input
            type="number" class="form-input-field"
            formControlName="weight"
            placeholder="1200.50">
            <div
  class="validation-error"
  *ngIf="loadForm.get('weight')?.touched &&
         loadForm.get('weight')?.hasError('required')">
  Weight is required
</div>
        </div>

        <div class="form-group">
          <label>Pieces <span class="required">*</span></label>
          <input
            type="number" class="form-input-field"
            formControlName="pieces"
            placeholder="20">
            <div
  class="validation-error"
  *ngIf="loadForm.get('pieces')?.touched &&
         loadForm.get('pieces')?.hasError('required')">
  Pieces is required
</div>
        </div>

      </div>

      <button type="submit">
        Create Load
      </button>

    </form>

  </div>

</div>
